name: Deploy

on:
  push:
    branches: [main]

# A queued deploy should not overtake a newer one, but never cancel a deploy
# that is already talking to Cloudflare.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Declared once rather than inlined: this hostname is derived from `name` in
# wrangler.jsonc and the two must not drift apart.
env:
  HEALTH_URL: https://estate-manager.estate-manager.workers.dev/api/health

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      # Lint and build run first on purpose. Branch protection with required
      # checks only applies to pull requests, so on a direct push to main this
      # in-job ordering is the only gate there is: any failing step above means
      # wrangler never runs.
      #
      # SUPABASE_URL / SUPABASE_KEY are NOT passed here. In production they are
      # Workers Secrets, set once via `wrangler secret put` and held by the
      # platform. The env vars above exist only so the build can read them.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

      # A green `wrangler deploy` only proves the Worker was published, not that
      # it works. Nothing at build time can catch a missing or rotated Workers
      # Secret: CI builds with GitHub secrets, while the running Worker reads
      # platform secrets the build never sees. Probing the deployed Worker is the
      # only check positioned to see that.
      #
      # --fail is what turns a 503 into a non-zero exit; without it curl exits 0
      # on any HTTP response. --retry-all-errors is required alongside it because
      # a 503 body is a completed transfer, which plain --retry would not re-attempt.
      # Together they absorb edge propagation and a brief Supabase blip.
      #
      # /api/health answers 503 for both "missing credentials" and "Supabase
      # unreachable" -- indistinguishable by design, since neither may leak the
      # URL or key. So this step fails the job for a human to judge rather than
      # acting on the verdict; there is deliberately no auto-rollback.
      - name: Verify the deployed Worker can reach Supabase
        run: |
          curl --fail --silent --show-error \
               --retry 5 --retry-delay 5 --retry-all-errors \
               "$HEALTH_URL"
