name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Explicit on purpose: setup-node v5 added automatic caching driven by
          # `packageManager` in package.json, which this repo does not declare.
          # Naming the cache here keeps the behaviour independent of that field.
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      # The unit gate (test plan §5). Placed before `build` because it needs no
      # build output and no secrets, so it is the cheapest step that can fail.
      - run: npm test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  # The database contract gate (test plan §5), which that section flagged as
  # needing "Docker and a migrated local stack inside CI, which no current
  # workflow provides." This job is that provision.
  #
  # It is a separate job, not a step in `ci`, for two reasons: it needs no npm
  # install and no repository secrets, and `supabase start` costs minutes that
  # should not sit between a lint error and the developer who caused it. Running
  # in parallel means the slow gate never delays the fast one.
  #
  # `supabase start` applies everything in supabase/migrations/ to a fresh
  # database, so this job also proves the migrations apply cleanly from zero —
  # something no other workflow checks, and which matters because migrations
  # reach production by hand (`supabase db push`) and are forward-only.
  db-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase test db

  # The browser gate. These tests cross auth, routing, the API, the database and
  # SSR in one go, which is the whole reason they exist — and also why they are
  # slow. Like `db-contract`, they get their own job so a full browser run never
  # sits between a lint error and the developer who caused it.
  #
  # Nothing here is mocked. `supabase start` gives a real database with the
  # migrations applied from zero and supabase/seed.sql loaded, which is where the
  # administrator account the suite signs in as comes from. Playwright starts the
  # app itself (`webServer` in playwright.config.ts) on the same workerd runtime
  # `npm run dev` uses locally.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      # Chromium only. The suite asserts behaviour, not rendering, so a second
      # engine would double the minutes and prove nothing the first did not.
      - run: npx playwright install --with-deps chromium
      - run: supabase start
      # Two different consumers need the stack's values, and neither can be
      # committed: the app reads .dev.vars (gitignored, and holding a developer's
      # own pointer locally), while the test fixtures read E2E_* from the
      # environment. Both are filled from the stack this job just started, so
      # nothing here depends on a key living in the repository or in secrets.
      - name: Point the app and the fixtures at this job's stack
        run: |
          # Via a file rather than `. <(supabase status -o env)`: process
          # substitution sourced empty here, and an empty SUPABASE_URL does not
          # fail — it makes createClient() return null and every auth path
          # silently no-op, which would surface as an inexplicable red suite.
          supabase status -o env > "$RUNNER_TEMP/stack.env"
          set -a
          . "$RUNNER_TEMP/stack.env"
          set +a
          # ANON_KEY and SERVICE_ROLE_KEY are the legacy JWTs. `status -o env` still
          # emits both, and both still work, but the CLI marks them deprecated and its
          # start banner now advertises only Publishable and Secret. Prefer the current
          # names and keep the old ones as the fallback, so an older CLI on a
          # developer's machine still works. This is forward-compatibility, not a fix
          # for anything failing today.
          PUBLISHABLE="${PUBLISHABLE_KEY:-$ANON_KEY}"
          SECRET="${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          # An empty value here is the failure this whole step is written to avoid: it
          # makes createClient() return null, every auth path no-op, and the suite red
          # for reasons that point nowhere near the cause.
          for pair in "API_URL:$API_URL" "PUBLISHABLE:$PUBLISHABLE" "SECRET:$SECRET" "DB_URL:$DB_URL"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::${pair%%:*} came back empty from \`supabase status -o env\`; the stack did not start as expected."
              exit 1
            fi
          done
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$PUBLISHABLE" > .dev.vars
          {
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SERVICE_ROLE_KEY=$SECRET"
            echo "E2E_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"
          # Which names this CLI actually emitted. Values never printed -- two of
          # these are credentials -- but the names alone are what tells a reader
          # whether a fallback fired, and they cost nothing to keep.
          echo "Emitted by \`supabase status -o env\`: $(cut -d= -f1 "$RUNNER_TEMP/stack.env" | tr '\n' ' ')"
      # The fixtures need a key that bypasses RLS, and the way that key fails is the
      # problem: a wrong one is not rejected, it resolves to a role without the grants
      # and surfaces much later as `permission denied` from whichever fixture ran
      # first. Ask PostgREST here instead, where the answer names the actual cause.
      - name: Check the fixture key reaches the database
        run: |
          status=$(curl -s -o "$RUNNER_TEMP/probe.json" -w '%{http_code}' \
            "$E2E_SUPABASE_URL/rest/v1/buildings?select=id&limit=1" \
            -H "apikey: $E2E_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $E2E_SERVICE_ROLE_KEY")
          if [ "$status" != "200" ]; then
            echo "::error::The fixture key cannot read \`buildings\` (HTTP $status). E2E would fail as \`permission denied\` from a fixture instead. PostgREST said: $(cat "$RUNNER_TEMP/probe.json")"
            exit 1
          fi
          echo "Fixture key reaches \`buildings\` (HTTP 200)."
      - run: npx playwright test
